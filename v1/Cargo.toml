[package]
name = "server-status-display-v1"
description = "Full-screen, continuously updating server status display built with GPUI."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "server-status-display-v1"
path = "src/main.rs"

[dependencies]
server-status-core.workspace = true
clap.workspace = true
env_logger.workspace = true
log.workspace = true
time.workspace = true
gpui = { git = "https://github.com/zed-industries/zed", rev = "6501df15765d66d6c2a2b66b1eb22434ccef3f86" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "6501df15765d66d6c2a2b66b1eb22434ccef3f86", features = ["font-kit", "wayland", "x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle.workspace = true
