name: Release builds

on:
  pull_request:
    branches:
      - release
    types:
      - closed
  workflow_dispatch:
    inputs:
      version:
        description: Stable version in Cargo.toml (for example, 0.1.0)
        required: true
        type: string
      publish:
        description: Publish a GitHub Release from the selected branch
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

jobs:
  validate:
    name: Validate release request
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch') ||
      (github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_COMMIT }}

      - name: Check release version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "server-status-display") | .version')"
          number='(0|[1-9][0-9]*)'
          if [[ ! "$version" =~ ^$number\.$number\.$number$ ]]; then
            echo "Cargo.toml must specify a stable SemVer version." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$RELEASE_VERSION" != "$version" ]]; then
            echo "The requested version must match Cargo.toml." >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: server-status-display-linux-x86_64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: server-status-display-linux-aarch64
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: server-status-display-windows-x86_64.exe
          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: server-status-display-windows-aarch64.exe
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            asset: server-status-display-macos-aarch64
    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_COMMIT }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libfontconfig-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libegl1-mesa-dev

      - name: Install Rust target
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Test release build
        run: cargo test --release --locked --target "${{ matrix.target }}"

      - name: Build release executable
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Prepare release asset
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          source="target/$RELEASE_TARGET/release/server-status-display"
          if [[ "$RUNNER_OS" == Windows ]]; then
            source="${source}.exe"
          fi
          mkdir release-assets
          cp "$source" "release-assets/$RELEASE_ASSET"
          if [[ "$RUNNER_OS" == macOS ]]; then
            shasum -a 256 "release-assets/$RELEASE_ASSET"
          else
            sha256sum "release-assets/$RELEASE_ASSET"
          fi | awk '{print $1}' > "release-assets/$RELEASE_ASSET.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'pull_request' || inputs.publish
    runs-on: ubuntu-latest
    needs:
      - validate
      - build
    permissions:
      contents: write
    steps:
      - name: Check out selected release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-server-status-display-*
          merge-multiple: true
          path: release-assets

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          hashes=(release-assets/*.sha256)
          assets=(release-assets/*)
          if (( ${#hashes[@]} != 5 || ${#assets[@]} != 10 )); then
            echo "Expected five executables and five SHA-256 files." >&2
            exit 1
          fi
          for checksum in "${hashes[@]}"; do
            printf '%s  %s\n' "$(<"$checksum")" "${checksum%.sha256}" | sha256sum --check
          done

      - name: Tag the selected commit and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          ref="refs/tags/$RELEASE_TAG"
          refs="$(git ls-remote --tags origin "$ref" "$ref^{}")"
          if [[ -z "$refs" ]]; then
            git push origin "$RELEASE_COMMIT:$ref"
          else
            tag_commit="$(awk -v ref="$ref" '
              $2 == ref { tagged = $1 }
              $2 == ref "^{}" { peeled = $1 }
              END { print (peeled ? peeled : tagged) }
            ' <<< "$refs")"
            if [[ "$tag_commit" != "$RELEASE_COMMIT" ]]; then
              echo "This version tag points to another commit." >&2
              exit 1
            fi
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Status Display $RELEASE_TAG" \
            --generate-notes
