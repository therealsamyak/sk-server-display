# Server status display configuration.
#
# Copy this file to the default location and edit the URLs:
#   Windows: %APPDATA%\server-status-display\config.toml
#   macOS:   ~/Library/Application Support/server-status-display/config.toml
#   Linux:   ~/.config/server-status-display/config.toml
# Or start the app with --config <path>.
#
# Use full Tailscale MagicDNS names. Do not commit your real file.

# Wallpaper folder: one JPEG or PNG file for each style, named after the
# style, such as "cyrene-bow.png" or "hills.jpg". See "Styles" in README.md.
# A relative path starts from the folder of this file. A style without a
# file shows its solid background color, and slideshows skip it.
# The app keeps favorites, slideshows, and the style on screen in
# status-display-state.toml next to this file.
wallpapers = "wallpapers"

# Host cards for the left column, in order. Each card reads one source:
# - glances_url: CPU, memory, disk, network, and uptime from Glances
#   (glances -w) on that host. While Glances does not answer, for example
#   when the host sleeps, the card shows the Tailscale presence instead.
# - this_machine = true: the same metrics from the machine that runs the
#   display.
# - neither: a status card with the online state of the device with this
#   name, from Tailscale. Use the first label of its MagicDNS name. Use this
#   for laptops, phones, and tablets.
# Without [[host]] blocks, the display shows one card for this machine.
[[host]]
name = "server"
glances_url = "http://server.example.ts.net:61208"
# Optional. Opens btop over SSH from the expanded host card.
# btop_ssh = "operator@server.example.ts.net"

[[host]]
name = "desk"
glances_url = "http://desk.example.ts.net:61208"

[[host]]
name = "laptop"

# A public Uptime Kuma status page. The app reads it without sign-in.
[uptime_kuma]
url = "http://server.example.ts.net:3001"
status_page = "home"

# Scrutiny SMART disk health.
[scrutiny]
url = "http://server.example.ts.net:8080"

# Tailnet devices from `tailscale status --json`.
[tailscale]
enabled = true
command = "tailscale"
