# Optional preset image folder, relative to this file. See WALLPAPERS.md.
# preset_wallpapers = "wallpapers"

# Optional Windows battery indicator placement. Match the name of one host card.
# battery_host = "This machine"

# An empty configuration also shows local metrics. Rename this card as needed.
[[host]]
name = "This machine"
source = "local"

# Add one block per remote host. Replace the example URL with your Glances v4 URL.
# [[host]]
# name = "Office server"
# source = "glances"
# url = "http://glances.example.com:61208"
# fallback_device = "office-server" # Optional Tailscale device name.
# show_btop = true # Optional in-app btop window.

# A presence-only card uses the device name in Tailscale, separate from its label.
# [[host]]
# name = "Travel laptop"
# source = "tailscale"
# device = "laptop"

# The device list is independent of individual cards.
# [tailscale]
# show_devices = true
# command = "tailscale"

# [uptime_kuma]
# url = "https://status.example.com"
# status_page = "home"

# [scrutiny]
# url = "https://disks.example.com"
