[package]
name = "server-status-display"
version = "0.2.1"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Full-screen, continuously updating server status display built with GPUI."

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[[bin]]
name = "server-status-display"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.86"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
rand = "0.9"
gpui = { git = "https://github.com/zed-industries/zed", rev = "6501df15765d66d6c2a2b66b1eb22434ccef3f86" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "6501df15765d66d6c2a2b66b1eb22434ccef3f86", features = ["font-kit", "wayland", "x11"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.144"
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing", "serde"] }
ureq = { version = "3", features = ["json"] }
toml = "1.2.2"
dirs = "7.0.0"
# GPUI already builds `image` with these decoders. The status display uses it
# to scale the wallpaper to the display size before upload.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
sysinfo = "0.40.4"
tempfile = "3"
sha2 = "0.10"
semver = "1.0"

# build.rs embeds the Windows app icon resource.
[build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_apple = { git = "https://github.com/zed-industries/zed", rev = "6501df15765d66d6c2a2b66b1eb22434ccef3f86" }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFRunLoop", "CFString"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "ps"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "inhibit"] }
futures-lite = "2"

# GPUI resolves these crates through Zed's workspace patches. Cargo does not
# apply a dependency's patches, so this crate repeats the ones GPUI needs.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task", rev = "41fd3359c75e221bd8b187a8ee361aa309c1714c" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

[profile.dev]
debug = "limited"

[profile.dev.package."*"]
opt-level = 2

# Zed's release settings: one codegen unit and ThinLTO. The status display
# also strips symbols, as gpui-component does, to make the binary smaller.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
